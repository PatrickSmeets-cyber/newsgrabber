name: Daily Update

on:
  schedule:
    # Draait elke 5 minuten
    - cron: '*/5 * * * *'
  workflow_dispatch: # Maakt handmatig starten via de GitHub interface mogelijk

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai feedparser

      - name: Run script
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          python generate.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update nieuwsboard" && git push)
