name: Nieuwsboard Uurlijkse Update

on:
  schedule:
    # Trigger elk uur (het Python script bepaalt zelf of er daadwerkelijk een AI-update draait)
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser google-genai tzdata

      - name: Run script
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          python generate.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html opinion_cache.json || true
          TIMESTAMP=$(date +'%Y-%m-%d %H:%M:%S')
          git commit --allow-empty -m "Automatische update [$TIMESTAMP]"
          git push
