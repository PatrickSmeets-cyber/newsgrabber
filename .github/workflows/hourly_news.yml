name: Automatische Nieuws Update

on:
  schedule:
    # Kies een afwijkende minuut, bijv. minuut 14 over het uur
    - cron: '14 * * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Afhankelijkheden installeren
        run: |
          python -m pip install --upgrade pip
          pip install feedparser google-genai

      - name: Python script uitvoeren
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python generate.py

      - name: Wijzigingen committen en pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html opinion_cache.json || true
          git commit -m "Update nieuwsboard [$(date +'%Y-%m-%d %H:%M:%S')]" || echo "Geen wijzigingen om te committen"
          git push origin main
